apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: banking-obs
spec:
  selector:
    app: payment-service
  ports:
  - port: 5001
    targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-external
  namespace: banking-obs
spec:
  selector:
    app: payment-service
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 30001
  type: NodePort
