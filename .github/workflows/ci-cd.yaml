name: Build & Deploy BankObs

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payment-service, auth-service, account-service, remediation-bot]
    steps:
    - uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service == 'remediation-bot' && 'remediation-bot' || format('services/{0}', matrix.service) }}
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
